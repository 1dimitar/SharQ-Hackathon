[project]
name = "shinka-network"
version = "0.1.0"
description = "Evolve the demand-based surrogate of the QOBLIB 08 network-design QUBO with ShinkaEvolve"
requires-python = ">=3.12,<3.13"
# Separate from the notebook environment: qoro-divi needs rich>=15, ShinkaEvolve needs rich<15.
dependencies = [
    "dimod",
    "dwave-samplers",
    "numpy",
    "requests",
    "scipy>=1.18.1",
    "shinka-evolve @ git+https://github.com/SakanaAI/ShinkaEvolve@706276f611bee7c3348ee34aca8c9589ebc2939c",
]
